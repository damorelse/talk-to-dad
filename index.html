<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>TalkWithDad</title>
    
    <!-- PWA & Apple Web App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TalkWithDad" />
    <meta name="application-name" content="TalkWithDad" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="TalkWithDad - iPad-optimized offline AAC application for stroke recovery, aphasia rehabilitation, and family caregiving." />
    <meta name="google-site-verification" content="fFzaGWAQ483Zoq7uSw_RCLjyD4hGh2mndqBANhHyfQQ" />

    <!-- OpenGraph & Social Metadata for Domain / App Identity -->
    <meta property="og:title" content="TalkWithDad" />
    <meta property="og:site_name" content="TalkWithDad" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://damorelse.github.io/talk-with-dad/" />
    <meta property="og:description" content="TalkWithDad Assistive AAC Communication & Speech Practice" />

    <!-- Schema.org WebApplication Metadata -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "TalkWithDad",
      "alternateName": "TalkWithDad AAC",
      "url": "https://damorelse.github.io/talk-with-dad/",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "All"
    }
    </script>
    
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="apple-touch-startup-image" href="./splash.png" />
    
    <!-- Compiled Production Tailwind CSS -->
    <link rel="stylesheet" href="./styles.css" />
    

    
    <!-- Prevent standard double-tap zoom, viewport shift & bounce scrolling on iOS Safari -->
    <style>
      html, body {
        height: 100%;
        height: 100dvh;
        height: -webkit-fill-available;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        overscroll-behavior-y: none;
        -webkit-overflow-scrolling: auto;
        position: fixed;
        inset: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: manipulation;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }
      html.light, html.light body {
        background-color: #f8fafc;
        color: #0f172a;
      }
      html.dark, html.dark body {
        background-color: #0f172a;
        color: #f8fafc;
      }
      #root {
        height: 100%;
        height: 100dvh;
        height: -webkit-fill-available;
        width: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* Shake animation for PIN errors */
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-10px); }
        40%, 80% { transform: translateX(10px); }
      }
      .animate-shake {
        animation: shake 0.5s ease-in-out;
      }
      /* Custom scrollbar hiding */
      .scrollbar-none::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-none {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="bg-slate-100 text-slate-900 dark:bg-slate-900 dark:text-slate-50 antialiased select-none transition-colors">
    <div id="root">
      <!-- Static App Identity Header for crawlers & pre-hydration display -->
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;height:100dvh;text-align:center;padding:24px;background-color:#0f172a;color:#ffffff;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
        <h1 style="font-size:2.5rem;font-weight:900;margin:0 0 8px 0;color:#3b82f6;letter-spacing:-0.025em;">TalkWithDad</h1>
        <p style="font-size:1.125rem;font-weight:600;margin:0 0 16px 0;color:#cbd5e1;">Assistive AAC & Speech Rehabilitation</p>
        <div style="font-size:0.875rem;color:#94a3b8;">Loading TalkWithDad...</div>
      </div>
    </div>
    <noscript>
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px;font-family:sans-serif;">
        <h1 style="font-size:2rem;font-weight:bold;color:#2563eb;">TalkWithDad</h1>
        <p>TalkWithDad requires JavaScript enabled to run.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
